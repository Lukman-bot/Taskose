<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" name="viewport"/>
  <!-- font -->
  <link href="fonts/fonts.css" rel="stylesheet"/>
  <!-- Icons -->
  <link href="fonts/font-icons.css" rel="stylesheet"/>
  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
  <link href="css/apexcharts.css" rel="stylesheet" type="text/css"/>
  <link href="css/styles.css" rel="stylesheet" type="text/css">
   <!-- Favicon and Touch Icons  -->
   <link href="images/logo/168.png" rel="shortcut icon">
    <link href="images/logo/168.png" rel="apple-touch-icon-precomposed">
     <title>
      Chart
     </title>
    </link>
   </link>
  </link>
 </head>
 <body>
  <!-- preloade -->
  <div class="preload preload-container">
   <div class="logo-img">
    <img alt="logo" src="images/logo/logo-2.png"/>
   </div>
   <div class="spinner-circle lg success">
    <span class="spinner-circle1 spinner-child">
    </span>
    <span class="spinner-circle2 spinner-child">
    </span>
    <span class="spinner-circle3 spinner-child">
    </span>
    <span class="spinner-circle4 spinner-child">
    </span>
    <span class="spinner-circle5 spinner-child">
    </span>
    <span class="spinner-circle6 spinner-child">
    </span>
    <span class="spinner-circle7 spinner-child">
    </span>
    <span class="spinner-circle8 spinner-child">
    </span>
    <span class="spinner-circle9 spinner-child">
    </span>
   </div>
  </div>
  <!-- /preload -->
  <div class="header fixed-top line-bt">
   <div class="left">
    <a class="icon back-btn" href="javascript:void(0);">
     <i class="icon-back">
     </i>
    </a>
   </div>
   <h4>
    Chart
   </h4>
  </div>
  <div class="app-content style-3 pb-32">
   <div class="tf-container">
    <div class="card mt-20">
     <div class="card-body">
      <div id="donut-chart">
      </div>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-body">
      <div id="donut-chart2">
      </div>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-body">
      <div id="bar-chart">
      </div>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-body">
      <div id="area-chart">
      </div>
     </div>
    </div>
   </div>
  </div>
  <script src="js/bootstrap.min.js" type="text/javascript">
  </script>
  <script src="js/jquery.min.js" type="text/javascript">
  </script>
  <script src="js/apexcharts.js" type="text/javascript">
  </script>
  <script src="js/chart-init.js" type="text/javascript">
  </script>
  <script src="js/main.js" type="text/javascript">
  </script>
 </body>
</html>
