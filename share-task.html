<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" name="viewport"/>
  <!-- font -->
  <link href="fonts/fonts.css" rel="stylesheet"/>
  <!-- Icons -->
  <link href="fonts/font-icons.css" rel="stylesheet"/>
  <link href="css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/nouislider.min.css" rel="stylesheet" type="text/css">
   <link href="css/swiper-bundle.min.css" rel="stylesheet"/>
   <link href="css/styles.css" rel="stylesheet" type="text/css">
    <!-- Favicon and Touch Icons  -->
    <link href="images/logo/168.png" rel="shortcut icon">
     <link href="images/logo/168.png" rel="apple-touch-icon-precomposed">
      <title>
       Share task
      </title>
     </link>
    </link>
   </link>
  </link>
 </head>
 <body>
  <!-- preloade -->
  <div class="preload preload-container">
   <div class="logo-img">
    <img alt="logo" src="images/logo/logo-2.png"/>
   </div>
   <div class="spinner-circle lg success">
    <span class="spinner-circle1 spinner-child">
    </span>
    <span class="spinner-circle2 spinner-child">
    </span>
    <span class="spinner-circle3 spinner-child">
    </span>
    <span class="spinner-circle4 spinner-child">
    </span>
    <span class="spinner-circle5 spinner-child">
    </span>
    <span class="spinner-circle6 spinner-child">
    </span>
    <span class="spinner-circle7 spinner-child">
    </span>
    <span class="spinner-circle8 spinner-child">
    </span>
    <span class="spinner-circle9 spinner-child">
    </span>
   </div>
  </div>
  <!-- /preload -->
  <div class="header fixed-top line-bt">
   <div class="left">
    <a class="icon back-btn" href="javascript:void(0);">
     <i class="icon-back">
     </i>
    </a>
   </div>
   <h5>
    Share Task
   </h5>
  </div>
  <div class="app-content style-2">
   <div class="tf-container">
    <div class="mt-24 box-ip">
     <input placeholder="Add people, emails or group" type="text"/>
     <a class="text-right" href="#">
      Invite
     </a>
    </div>
    <ul class="mt-26">
     <li class="d-flex justify-content-between align-items-center">
      <label class="d-flex align-items-center gap-16" for="swCheck1">
       <svg fill="none" height="26" viewbox="0 0 26 26" width="26" xmlns="http://www.w3.org/2000/svg">
        <path d="M1.80001 9H24.2M1.80001 17H24.2M12.3333 1C10.0871 4.59948 8.89624 8.75715 8.89624 13C8.89624 17.2428 10.0871 21.4005 12.3333 25M13.6667 1C15.9129 4.59948 17.1037 8.75715 17.1037 13C17.1037 17.2428 15.9129 21.4005 13.6667 25M25 13C25 19.6274 19.6274 25 13 25C6.37258 25 1 19.6274 1 13C1 6.37258 6.37258 1 13 1C19.6274 1 25 6.37258 25 13Z" stroke="#7980FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
        </path>
       </svg>
       <div class="content">
        <div class="font-title-btn">
         Share to web
        </div>
        <p class="mt-4 text-black-5 body-2">
         Anyone with the link can view
        </p>
       </div>
      </label>
      <input checked="" class="tf-switch-check" id="swCheck1" type="checkbox"/>
     </li>
     <li class="mt-22 d-flex justify-content-between align-items-center">
      <label class="font-title-btn flex-grow-1" for="swCheck2">
       Allow editing
      </label>
      <input class="tf-switch-check" id="swCheck2" type="checkbox"/>
     </li>
     <li class="mt-22 d-flex justify-content-between align-items-center">
      <label class="font-title-btn flex-grow-1" for="swCheck3">
       Allow comments
      </label>
      <input class="tf-switch-check" id="swCheck3" type="checkbox"/>
     </li>
     <li class="mt-22 d-flex justify-content-between align-items-center">
      <label class="font-title-btn flex-grow-1" for="swCheck4">
       Allow duplicate as template
      </label>
      <input class="tf-switch-check" id="swCheck4" type="checkbox"/>
     </li>
    </ul>
    <div class="footer-fixed button">
     <a class="tf-btn primary" href="invite-colleagues.html">
      Done
     </a>
    </div>
   </div>
  </div>
  <script src="js/bootstrap.min.js" type="text/javascript">
  </script>
  <script src="js/jquery.min.js" type="text/javascript">
  </script>
  <script src="js/main.js" type="text/javascript">
  </script>
 </body>
</html>
