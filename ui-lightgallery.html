<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" name="viewport"/>
  <!-- font -->
  <link href="fonts/fonts.css" rel="stylesheet"/>
  <!-- Icons -->
  <link href="fonts/font-icons.css" rel="stylesheet"/>
  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
  <link href="css/lightgallery.css" rel="stylesheet" type="text/css">
   <!-- lightgallery plugins -->
   <link href="css/lg-zoom.css" rel="stylesheet" type="text/css">
    <link href="css/lg-thumbnail.css" rel="stylesheet" type="text/css">
     <link href="css/styles.css" rel="stylesheet" type="text/css"/>
     <!-- Favicon and Touch Icons  -->
     <link href="images/logo/168.png" rel="shortcut icon"/>
     <link href="images/logo/168.png" rel="apple-touch-icon-precomposed"/>
     <title>
      Light Gallery
     </title>
    </link>
   </link>
  </link>
 </head>
 <body>
  <!-- preloade -->
  <div class="preload preload-container">
   <div class="logo-img">
    <img alt="logo" src="images/logo/logo-2.png"/>
   </div>
   <div class="spinner-circle lg success">
    <span class="spinner-circle1 spinner-child">
    </span>
    <span class="spinner-circle2 spinner-child">
    </span>
    <span class="spinner-circle3 spinner-child">
    </span>
    <span class="spinner-circle4 spinner-child">
    </span>
    <span class="spinner-circle5 spinner-child">
    </span>
    <span class="spinner-circle6 spinner-child">
    </span>
    <span class="spinner-circle7 spinner-child">
    </span>
    <span class="spinner-circle8 spinner-child">
    </span>
    <span class="spinner-circle9 spinner-child">
    </span>
   </div>
  </div>
  <!-- /preload -->
  <div class="header fixed-top line-bt">
   <div class="left">
    <a class="icon back-btn" href="javascript:void(0);">
     <i class="icon-back">
     </i>
    </a>
   </div>
   <h4>
    Light Gallery
   </h4>
  </div>
  <div class="app-content style-3 pb-32">
   <div class="tf-container">
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Light Gallery 3 column
      </h4>
     </div>
     <div class="card-body mt-20">
      <div class="grid-3 gap-10" id="lightgallery3">
       <a class="lightgallery-box" href="images/store/store4.png">
        <img alt="image" src="images/store/store4.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store5.png">
        <img alt="image" src="images/store/store5.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store6.png">
        <img alt="image" src="images/store/store6.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store7.png">
        <img alt="image" src="images/store/store7.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store8.png">
        <img alt="image" src="images/store/store8.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store9.png">
        <img alt="image" src="images/store/store9.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store10.png">
        <img alt="image" src="images/store/store10.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store11.png">
        <img alt="image" src="images/store/store11.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store12.png">
        <img alt="image" src="images/store/store12.png"/>
       </a>
      </div>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Light Gallery 2 column
      </h4>
     </div>
     <div class="card-body mt-20">
      <div class="grid-2 gap-10" id="lightgallery2">
       <a class="lightgallery-box" href="images/store/store12.png">
        <img alt="image" src="images/store/store12.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store13.png">
        <img alt="image" src="images/store/store13.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store14.png">
        <img alt="image" src="images/store/store14.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store15.png">
        <img alt="image" src="images/store/store15.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store16.png">
        <img alt="image" src="images/store/store16.png"/>
       </a>
       <a class="lightgallery-box" href="images/store/store17.png">
        <img alt="image" src="images/store/store17.png"/>
       </a>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script src="js/bootstrap.min.js" type="text/javascript">
  </script>
  <script src="js/jquery.min.js" type="text/javascript">
  </script>
  <script src="js//lightgallery.umd.js" type="text/javascript">
  </script>
  <script src="js//lg-thumbnail.umd.js" type="text/javascript">
  </script>
  <script src="js/lg-zoom.umd.js" type="text/javascript">
  </script>
  <script src="js/main.js" type="text/javascript">
  </script>
