<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" name="viewport"/>
  <!-- font -->
  <link href="fonts/fonts.css" rel="stylesheet"/>
  <!-- Icons -->
  <link href="fonts/font-icons.css" rel="stylesheet"/>
  <link href="css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/nouislider.min.css" rel="stylesheet" type="text/css">
   <link href="css/swiper-bundle.min.css" rel="stylesheet"/>
   <link href="css/styles.css" rel="stylesheet" type="text/css">
    <!-- Favicon and Touch Icons  -->
    <link href="images/logo/168.png" rel="shortcut icon">
     <link href="images/logo/168.png" rel="apple-touch-icon-precomposed">
      <title>
       sign in
      </title>
     </link>
    </link>
   </link>
  </link>
 </head>
 <body>
  <!-- preloade -->
  <div class="preload preload-container">
   <div class="logo-img">
    <img alt="logo" src="images/logo/logo-2.png"/>
   </div>
   <div class="spinner-circle lg success">
    <span class="spinner-circle1 spinner-child">
    </span>
    <span class="spinner-circle2 spinner-child">
    </span>
    <span class="spinner-circle3 spinner-child">
    </span>
    <span class="spinner-circle4 spinner-child">
    </span>
    <span class="spinner-circle5 spinner-child">
    </span>
    <span class="spinner-circle6 spinner-child">
    </span>
    <span class="spinner-circle7 spinner-child">
    </span>
    <span class="spinner-circle8 spinner-child">
    </span>
    <span class="spinner-circle9 spinner-child">
    </span>
   </div>
  </div>
  <!-- /preload -->
  <div class="header fixed-top line-bt">
   <div class="left">
    <a class="icon back-btn" href="javascript:void(0);">
     <i class="icon-back">
     </i>
    </a>
   </div>
   <h5>
    Sign In
   </h5>
  </div>
  <div class="app-content style-3 pb-32 signIn-area">
   <div class="tf-container">
    <form action="index.html" class="mt-24">
     <p class="body-6 text-black-5">
      Give creadential to sign in your account
     </p>
     <fieldset class="input-icon mt-20">
      <span class="icon icon-mail">
      </span>
      <input class="form-control" placeholder="Type your email" type="text"/>
     </fieldset>
     <fieldset class="mt-16 input-icon">
      <div class="box-view-hide">
       <span class="icon icon-lock">
       </span>
       <input class="form-control password-field" placeholder="Type your password" type="password"/>
       <div class="show-pass">
        <span class="icon-pass icon-view">
        </span>
        <span class="icon-pass icon-hide">
        </span>
       </div>
      </div>
     </fieldset>
     <div class="mt-16 d-flex justify-content-end">
      <a class="h8 text-primary fw-5" href="forgot-pass.html">
       Forgot Password?
      </a>
     </div>
     <button class="mt-48 tf-btn primary">
      Sign In
     </button>
    </form>
    <div class="auth-line body-6">
     or continue with
    </div>
    <div class="d-flex gap-16 justify-content-center">
     <a class="btn-social-icon" href="index.html">
      <img alt="img" class="img-icon" src="images/logo/fb.png"/>
     </a>
     <a class="btn-social-icon" href="index.html">
      <img alt="img" class="img-icon" src="images/logo/google.png"/>
     </a>
     <a class="btn-social-icon" href="index.html">
      <img alt="img" class="img-icon" src="images/logo/apple.png"/>
     </a>
    </div>
    <p class="mt-70 text-center body-2 fw-5 text-black-5">
     Donât have account?
     <a class="text-primary fw-7 body-2" href="sign-up.html">
      sign Up
     </a>
    </p>
   </div>
  </div>
  <script src="js/bootstrap.min.js" type="text/javascript">
  </script>
  <script src="js/jquery.min.js" type="text/javascript">
  </script>
  <script src="js/main.js" type="text/javascript">
  </script>
 </body>
</html>
