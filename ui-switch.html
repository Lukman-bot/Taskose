<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" name="viewport"/>
  <!-- font -->
  <link href="fonts/fonts.css" rel="stylesheet"/>
  <!-- Icons -->
  <link href="fonts/font-icons.css" rel="stylesheet"/>
  <link href="css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/nouislider.min.css" rel="stylesheet" type="text/css">
   <link href="css/swiper-bundle.min.css" rel="stylesheet"/>
   <link href="css/styles.css" rel="stylesheet" type="text/css">
    <!-- Favicon and Touch Icons  -->
    <link href="images/logo/168.png" rel="shortcut icon">
     <link href="images/logo/168.png" rel="apple-touch-icon-precomposed">
      <title>
       Switch
      </title>
     </link>
    </link>
   </link>
  </link>
 </head>
 <body>
  <!-- preloade -->
  <div class="preload preload-container">
   <div class="logo-img">
    <img alt="logo" src="images/logo/logo-2.png"/>
   </div>
   <div class="spinner-circle lg success">
    <span class="spinner-circle1 spinner-child">
    </span>
    <span class="spinner-circle2 spinner-child">
    </span>
    <span class="spinner-circle3 spinner-child">
    </span>
    <span class="spinner-circle4 spinner-child">
    </span>
    <span class="spinner-circle5 spinner-child">
    </span>
    <span class="spinner-circle6 spinner-child">
    </span>
    <span class="spinner-circle7 spinner-child">
    </span>
    <span class="spinner-circle8 spinner-child">
    </span>
    <span class="spinner-circle9 spinner-child">
    </span>
   </div>
  </div>
  <!-- /preload -->
  <div class="header fixed-top line-bt">
   <div class="left">
    <a class="icon back-btn" href="javascript:void(0);">
     <i class="icon-back">
     </i>
    </a>
   </div>
   <h4>
    Switch
   </h4>
  </div>
  <div class="app-content style-3 pb-32">
   <div class="tf-container">
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Switch
      </h4>
     </div>
     <div class="card-body mt-20">
      <fieldset class="fieldset-sw">
       <input class="tf-switch-check" id="switchCheckDefault" type="checkbox"/>
       <label class="fw-5" for="switchCheckDefault">
        Default Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw mt-10">
       <input checked="" class="tf-switch-check" id="switchChecked" type="checkbox"/>
       <label class="fw-5" for="switchChecked">
        Default Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw sw-disabled mt-10">
       <input class="tf-switch-check" disabled="" id="switchDisabled" type="checkbox"/>
       <label class="fw-5" for="switchDisabled">
        Disabled Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw sw-disabled mt-10">
       <input checked="" class="tf-switch-check" disabled="" id="switchCheckedDisabled" type="checkbox"/>
       <label class="fw-5" for="switchCheckedDisabled">
        Disabled Checked Switch
       </label>
      </fieldset>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Switches Colors
      </h4>
     </div>
     <div class="card-body mt-20">
      <fieldset class="fieldset-sw">
       <input checked="" class="tf-switch-check light" id="switchLight" type="checkbox"/>
       <label class="fw-5" for="switchLight">
        Light Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw mt-10">
       <input checked="" class="tf-switch-check success" id="switchSuccess" type="checkbox"/>
       <label class="fw-5" for="switchSuccess">
        Success Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw mt-10">
       <input checked="" class="tf-switch-check warning" id="switchWarning" type="checkbox"/>
       <label class="fw-5" for="switchWarning">
        Warning Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw mt-10">
       <input checked="" class="tf-switch-check danger" id="switchDanger" type="checkbox"/>
       <label class="fw-5" for="switchDanger">
        Danger Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw mt-10">
       <input checked="" class="tf-switch-check info" id="switchInfo" type="checkbox"/>
       <label class="fw-5" for="switchInfo">
        Info Switch
       </label>
      </fieldset>
      <fieldset class="fieldset-sw mt-10">
       <input checked="" class="tf-switch-check dark" id="switchDark" type="checkbox"/>
       <label class="fw-5" for="switchDark">
        Dark Switch
       </label>
      </fieldset>
     </div>
    </div>
   </div>
  </div>
  <script src="js/bootstrap.min.js" type="text/javascript">
  </script>
  <script src="js/jquery.min.js" type="text/javascript">
  </script>
  <script src="js/main.js" type="text/javascript">
  </script>
 </body>
</html>
