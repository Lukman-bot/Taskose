<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" name="viewport"/>
  <!-- font -->
  <link href="fonts/fonts.css" rel="stylesheet"/>
  <!-- Icons -->
  <link href="fonts/font-icons.css" rel="stylesheet"/>
  <link href="css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/bootstrap-select.min.css" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet" type="text/css">
   <!-- Favicon and Touch Icons  -->
   <link href="images/logo/168.png" rel="shortcut icon">
    <link href="images/logo/168.png" rel="apple-touch-icon-precomposed">
     <title>
      input
     </title>
    </link>
   </link>
  </link>
 </head>
 <body>
  <!-- preloade -->
  <div class="preload preload-container">
   <div class="logo-img">
    <img alt="logo" src="images/logo/logo-2.png"/>
   </div>
   <div class="spinner-circle lg success">
    <span class="spinner-circle1 spinner-child">
    </span>
    <span class="spinner-circle2 spinner-child">
    </span>
    <span class="spinner-circle3 spinner-child">
    </span>
    <span class="spinner-circle4 spinner-child">
    </span>
    <span class="spinner-circle5 spinner-child">
    </span>
    <span class="spinner-circle6 spinner-child">
    </span>
    <span class="spinner-circle7 spinner-child">
    </span>
    <span class="spinner-circle8 spinner-child">
    </span>
    <span class="spinner-circle9 spinner-child">
    </span>
   </div>
  </div>
  <!-- /preload -->
  <div class="header fixed-top line-bt">
   <div class="left">
    <a class="icon back-btn" href="javascript:void(0);">
     <i class="icon-back">
     </i>
    </a>
   </div>
   <h4>
    Input
   </h4>
  </div>
  <div class="app-content style-3 pb-32">
   <div class="tf-container">
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Input With Group Icon
      </h4>
     </div>
     <div class="card-body">
      <form>
       <fieldset class="mt-20 input-icon">
        <span class="icon icon-user">
        </span>
        <input class="form-control" placeholder="Enter your name" type="text"/>
       </fieldset>
       <fieldset class="mt-20 input-icon">
        <span class="icon icon-mail">
        </span>
        <input class="form-control" placeholder="Enter your email address" type="text"/>
       </fieldset>
       <fieldset class="mt-20 input-icon">
        <div class="box-view-hide">
         <span class="icon icon-lock">
         </span>
         <input class="form-control password-field" placeholder="Enter your password" type="password"/>
         <span class="show-pass">
          <i class="icon-pass icon-view">
          </i>
          <i class="icon-pass icon-hide">
          </i>
         </span>
        </div>
       </fieldset>
       <fieldset class="mt-20 input-icon drop-select">
        <div class="inner-group-ip">
         <select class="image-select">
          <option data-thumbnail="images/flags/eng.png">
          </option>
          <option data-thumbnail="images/flags/france.png">
          </option>
          <option data-thumbnail="images/flags/swedish.png">
          </option>
         </select>
        </div>
        <input class="form-control" placeholder="Enter your phone number" type="number"/>
       </fieldset>
       <fieldset class="mt-20 input-icon">
        <span class="icon icon-calendar">
        </span>
        <input class="form-control" type="date"/>
       </fieldset>
       <fieldset class="mt-20 input-upload up-lg">
        <span class="icon icon-upload2">
        </span>
        <input class="upload-file" type="file"/>
       </fieldset>
       <fieldset class="mt-20 input-icon">
        <textarea class="form-control ip-textarea" placeholder="Write your review"></textarea>
       </fieldset>
       <button class="mt-20 tf-btn primary">
        Button
       </button>
      </form>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Input Fill
      </h4>
     </div>
     <div class="card-body">
      <form>
       <fieldset class="mt-20 input-fill">
        <label>
         Your name
        </label>
        <input class="form-control" placeholder="Enter your name" type="text"/>
       </fieldset>
       <fieldset class="mt-20 input-fill">
        <label>

        </label>
        <input class="form-control" placeholder="Enter your email address" type="text"/>

       <fieldset class="mt-20 input-fill">
        <label>

        </label>
        <div class="box-view-hide">
         <input class="form-control password-field2" placeholder="Enter your password" type="password"/>
         <span class="show-pass2">
          <i class="icon-pass icon-view">
          </i>
          <i class="icon-pass icon-hide">
          </i>
         </span>
        </div>
       </fieldset>
       <fieldset class="mt-20 input-fill">
        <label>
         Website
        </label>
        <input class="form-control" placeholder="Website" type="text"/>
       </fieldset>
       <fieldset class="mt-20 input-fill">
        <label>
         Phone Number
        </label>
        <input class="form-control" placeholder="Enter your phone number" type="number"/>
       </fieldset>
       <fieldset class="mt-20 input-fill">
        <label>
         Birthday
        </label>
        <input class="form-control" type="date"/>
       </fieldset>
       <fieldset class="mt-20 input-upload">
        <span class="icon icon-upload2">
        </span>
        <input class="upload-file" type="file"/>
       </fieldset>
       <fieldset class="mt-20 input-fill">
        <label>
         Message
        </label>
        <textarea class="form-control" placeholder="Write your review"></textarea>
       </fieldset>
       <button class="mt-20 tf-btn primary">
        Button
       </button>
      </form>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Input Stroke
      </h4>
     </div>
     <div class="card-body">
      <form>
       <fieldset class="mt-20 input-stroke">
        <label>
         Your name
        </label>
        <input class="form-control" placeholder="Enter your name" type="text"/>

       <fieldset class="mt-20 input-stroke">

         <input class="form-control password-field3" placeholder="Enter your password" type="password"/>

          <i class="icon-pass icon-view">
          </i>
          <i class="icon-pass icon-hide">
          </i>
         </span>
        </div>
       </fieldset>
       <fieldset class="mt-20 input-stroke">
        <label>
         Website
        </label>
        <input class="form-control" placeholder="Website" type="text"/>
       </fieldset>
       <fieldset class="mt-26 input-stroke">
        <label>
         Phone Number
        </label>
        <input class="form-control" placeholder="Enter your phone number" type="number"/>
       </fieldset>
       <fieldset class="mt-20 input-stroke">
        <label>
         Birthday
        </label>
        <input class="form-control" type="date"/>
       </fieldset>
       <fieldset class="mt-26 input-upload">
        <span class="icon icon-upload2">
        </span>
        <input class="upload-file" type="file"/>
       </fieldset>
       <fieldset class="mt-20 input-stroke">
        <label>
         Message
        </label>
        <textarea class="form-control" placeholder="Write your review"></textarea>
       </fieldset>
       <button class="mt-20 tf-btn primary">
        Button
       </button>
      </form>
     </div>
    </div>
    <div class="card mt-20">
     <div class="card-header">
      <h4 class="fw-6">
       Input line
      </h4>
     </div>
     <div class="card-body">
      <form>
       <fieldset class="mt-20 input-line">
        <label>
         Your name
        </label>
        <input class="form-control" placeholder="Enter your name" type="text"/>
       </fieldset>
       <fieldset class="mt-20 input-line">
        <label>
         Email
        </label>
        <input class="form-control" placeholder="Enter your email address" type="text"/>
       </fieldset>
       <fieldset class="mt-20 input-line">
        <label>
         Password
        </label>
        <div class="box-view-hide">
         <input class="form-control password-field4" placeholder="Enter your password" type="password"/>
         <span class="show-pass4">
          <i class="icon-pass icon-view">
          </i>
          <i class="icon-pass icon-hide">
          </i>
         </span>
        </div>
       </fieldset>
       <fieldset class="mt-20 input-line">
        <label>
         Website
        </label>
        <input class="form-control" placeholder="Website" type="text"/>
       </fieldset>
       <fieldset class="mt-26 input-line">
        <label>
         Phone Number
        </label>
        <input class="form-control" placeholder="Enter your phone number" type="number"/>
       </fieldset>
       <fieldset class="mt-20 input-line">
        <label>
         Birthday
        </label>
        <input class="form-control" type="date"/>
       </fieldset>
       <fieldset class="mt-26 input-upload">
        <span class="icon icon-upload2">
        </span>
        <input class="upload-file" type="file"/>

       <fieldset class="mt-20 input-line">
        <label>

        </label>
        <textarea class="form-control" placeholder="Write your review"></textarea>
       </fieldset>
       <button class="mt-20 tf-btn primary">
        Button
       </button>
      </form>
     </div>
    </div>
   </div>
  </div>
  <script src="js/bootstrap.min.js" type="text/javascript">
  </script>
  <script src="js/jquery.min.js" type="text/javascript">
  </script>
  <script src="js/bootstrap-select.min.js" type="text/javascript">
  </script>
  <script src="js/main.js" type="text/javascript">
  </script>
 </body>
</html>
